<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>UEJAVA 智能体 - AI问答</title>
  <style>
    :root{--bg:#f3f5f7;--panel:#fff;--text:#1f2d3d;--muted:#7a869a;--brand:#4e8cff;--brand2:#5b7cfa;--bubble-user:#4e8cff;--bubble-bot:#fff;--border:#e6e9ef;--shadow:0 10px 30px rgba(31,45,61,.12)}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(1200px 600px at 20% 0%,rgba(78,140,255,.12),transparent 60%),radial-gradient(1000px 500px at 90% 10%,rgba(91,124,250,.12),transparent 55%),var(--bg);color:var(--text);height:100vh;display:flex;justify-content:center;align-items:center;padding:18px}
    .app{width:100%;max-width:980px;height:min(820px,92vh);background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,rgba(78,140,255,.08),rgba(91,124,250,.08))}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 18px rgba(78,140,255,.25)}
    .title strong{font-size:14px}.title span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
    .top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
    .pill{font-size:12px;color:var(--muted);padding:4px 10px;border-radius:10px;background:#f0f2f5}
    .pill.green{color:#4caf84;background:#e8f5ee}
    .pill.red{color:#e0556a;background:#fde8eb}
    .btn{font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel);cursor:pointer;color:var(--text)}
    .btn:hover{background:#f7f8fa}
    .msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
    .msg{display:flex;gap:10px;max-width:80%}
    .msg.user{align-self:flex-end;flex-direction:row-reverse}
    .msg.assistant{align-self:flex-start}
    .msg .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .msg.user .avatar{background:var(--brand);color:#fff}
    .msg.assistant .avatar{background:#f0f2f5}
    .msg .bubble{padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
    .msg.user .bubble{background:var(--bubble-user);color:#fff;border-bottom-right-radius:4px}
    .msg.assistant .bubble{background:var(--bubble-bot);border:1px solid var(--border);border-bottom-left-radius:4px}
    .typing{display:flex;gap:6px;padding:12px 16px}
    .typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:typing 1.2s infinite}
    .typing span:nth-child(2){animation-delay:.2s}
    .typing span:nth-child(3){animation-delay:.4s}
    @keyframes typing{0%,60%,100%{opacity:.3}30%{opacity:1}}
    .input-area{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end}
    textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;resize:none;min-height:44px;max-height:120px;font-family:inherit;outline:none;line-height:1.5}
    textarea:focus{border-color:var(--brand)}
    .send-btn{width:44px;height:44px;border-radius:10px;border:none;background:var(--brand);color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
    .send-btn:hover{background:var(--brand2)}.send-btn:disabled{opacity:.5}
    .nav-links{display:flex;gap:8px;margin-left:16px}
    .nav-links a{font-size:12px;color:var(--brand);text-decoration:none;padding:4px 10px;border-radius:6px;border:1px solid var(--border)}
    .nav-links a:hover{background:#f0f2f5}
    .images{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
    .images img{max-width:200px;max-height:150px;border-radius:8px;border:1px solid var(--border)}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div class="title"><strong>UEJAVA 智能体</strong><span>电力设施三维模型智能助手</span></div>
    </div>
    <div class="nav-links">
      <a href="import.html">📥 文档导入</a>
    </div>
    <div class="top-actions">
      <span class="pill green" id="statusPill">● 在线</span>
      <button class="btn" onclick="clearSession()">🗑 清空记录</button>
    </div>
  </div>

  <div class="msgs" id="msgList">
    <div class="msg assistant">
      <div class="avatar">🤖</div>
      <div class="bubble">你好！我是 UEJAVA 智能助手，可以帮你查询电力设施模型、场景信息和技术文档。你可以问我：<br><br>• 系统中有哪些风机模型？<br>• 松滋红光变电站的坐标是多少？<br>• 最近发布了哪些场景？<br>• 风机维护周期是多久？<br><br>请问有什么可以帮到你的？</div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="inputBox" placeholder="输入你的问题... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
const QUERY_URL = '/query';
const STREAM_URL = '/stream/';
const HISTORY_URL = '/history/';
const HEALTH_URL = '/health';

const msgList = document.getElementById('msgList');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const statusPill = document.getElementById('statusPill');

let sessionId = localStorage.getItem('uejava_session') || crypto.randomUUID();
localStorage.setItem('uejava_session', sessionId);

inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

async function sendMsg() {
  const text = inputBox.value.trim();
  if (!text) return;
  inputBox.value = '';
  inputBox.style.height = 'auto';
  sendBtn.disabled = true;

  addBubble('user', text);
  const typingEl = showTyping();
  scrollBottom();

  try {
    const resp = await fetch(QUERY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: text, session_id: sessionId, is_stream: true }),
    });
    if (!resp.ok) throw new Error(`请求失败: ${resp.status}`);
    const data = await resp.json();
    removeTyping(typingEl);
    if (!data.task_id) throw new Error('服务端未返回任务 ID');
    consumeStream(data.task_id);
  } catch (e) {
    removeTyping(typingEl);
    addBubble('assistant', '网络请求失败，请检查服务是否正常运行。');
    sendBtn.disabled = false;
  }
}

function consumeStream(taskId) {
  const bubble = addBubble('assistant', '');
  const source = new EventSource(STREAM_URL + encodeURIComponent(taskId));
  let answer = '';

  source.addEventListener('delta', event => {
    const data = JSON.parse(event.data);
    answer += data.delta || '';
    bubble.textContent = answer;
    scrollBottom();
  });

  source.addEventListener('final', event => {
    const data = JSON.parse(event.data);
    if (!answer) answer = data.answer || '未生成答案，请重试。';
    bubble.textContent = answer;
    source.close();
    sendBtn.disabled = false;
  });

  source.addEventListener('error', event => {
    if (event.data) {
      const data = JSON.parse(event.data);
      bubble.textContent = `任务执行失败：${data.error || '未知错误'}`;
      source.close();
      sendBtn.disabled = false;
    }
  });
}

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'user' ? '👤' : '🤖';
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${escapeHtml(text)}</div>`;

  // 提取图片
  const imgRegex = /!\[.*?\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s]+\.(png|jpg|jpeg|gif|webp))/gi;
  const urls = [];
  let m;
  while ((m = imgRegex.exec(text)) !== null) {
    urls.push(m[1] || m[0]);
  }
  if (urls.length > 0) {
    const imgsDiv = document.createElement('div');
    imgsDiv.className = 'images';
    for (const url of urls.slice(0, 6)) {
      const img = document.createElement('img');
      img.src = url;
      img.loading = 'lazy';
      imgsDiv.appendChild(img);
    }
    div.appendChild(imgsDiv);
  }

  msgList.appendChild(div);
  scrollBottom();
  return div.querySelector('.bubble');
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  msgList.appendChild(div);
  return div;
}

function removeTyping(el) { if (el) el.remove(); }

function scrollBottom() { msgList.scrollTop = msgList.scrollHeight; }

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function clearSession() {
  if (!confirm('确认清空当前会话的所有历史记录？')) return;
  try {
    await fetch(HISTORY_URL + sessionId, { method: 'DELETE' });
    sessionId = crypto.randomUUID();
    localStorage.setItem('uejava_session', sessionId);
    msgList.innerHTML = '';
    addBubble('assistant', '会话已重置，有什么可以帮到你的？');
  } catch (e) {
    alert('清空失败');
  }
}

// 健康检查
setInterval(async () => {
  try {
    const resp = await fetch(HEALTH_URL);
    const data = await resp.json();
    statusPill.className = data.ok ? 'pill green' : 'pill red';
    statusPill.textContent = data.ok ? '● 在线' : '● 离线';
  } catch { statusPill.className = 'pill red'; statusPill.textContent = '● 离线'; }
}, 10000);
</script>
</body>
</html>
