name: 回归测试
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run pytest -q --junitxml=examples/tests-ci.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: examples/tests-ci.xml
